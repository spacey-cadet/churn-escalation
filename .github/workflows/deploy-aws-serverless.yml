name: Deploy AWS Serverless

on:
  push:
    branches: [aws-serverless]
    paths-ignore:
      - "reference_rehearsal_scripts/**"
      - "**.md"
env:
  AWS_REGION: us-east-1

permissions:
  id-token: write # required for OIDC -- do not remove
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuses the SAME GitHub OIDC role Project 1's deploy-aws-serverless.yml
      # needs (AWS_DEPLOY_ROLE_ARN secret). That role's trust/permissions
      # policy must allow this repo's OIDC subject and include ECR/Lambda
      # permissions for the churn-serving repo/function.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug caller identity
        run: aws sts get-caller-identity

      # --provenance=false --sbom=false is not optional: default buildx
      # behavior attaches attestations that produce a multi-manifest OCI
      # image index, and Lambda's CreateFunction/UpdateFunctionCode
      # rejects that with "image manifest ... media type is not
      # supported." (hit and fixed once already, on Project 1.)
      - name: Build and push (Lambda-compatible manifest)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f Dockerfile.lambda \
            -t "$ECR_REGISTRY/churn-serving:${{ github.sha }}" \
            -t "$ECR_REGISTRY/churn-serving:latest" \
            --push .

      - name: Update Lambda function code
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name churn-serving \
            --image-uri "$ECR_REGISTRY/churn-serving:${{ github.sha }}"