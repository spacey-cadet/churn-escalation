name: Drift Check
# Hourly cron -- the free scheduled-Actions equivalent of an always-on
# streaming drift job, exactly as PIPELINE_README.md describes. The only
# change from the local version is WHERE it reads the inference log from:
# DynamoDB now, instead of a feature_store.sqlite file that no longer exists
# once the serving Lambda is the thing writing it.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write # required for OIDC -- do not remove
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # needed for the large model artifacts in src/models/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Reuses the SAME GitHub OIDC role as the deploy workflow
      # (AWS_DEPLOY_ROLE_ARN secret). That role's permissions policy must
      # allow read access to the DynamoDB tables referenced below.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run drift monitor against the live DynamoDB inference log
        env:
          S3_REGISTRY_BUCKET: ${{ secrets.S3_REGISTRY_BUCKET }}
          DYNAMODB_ONLINE_TABLE: churn-online-features
          DYNAMODB_OFFLINE_TABLE: churn-offline-features
          DYNAMODB_LOG_TABLE: churn-inference-log
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m src.drift_monitor