name: Deploy AWS Serverless

on:
  push:
    branches: [aws-serverless]
    paths-ignore:
      - "reference_rehearsal_scripts/**"
      - "**.md"

permissions:
  id-token: write # required for OIDC -- see note below
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuses the SAME GitHub OIDC role Project 1's deploy-aws-serverless.yml
      # needs (AWS_DEPLOY_ROLE_ARN secret) -- if that role doesn't exist yet,
      # this workflow fails the same way Project 1's does. Add this project's
      # ECR repo / Lambda function ARNs to that role's trust/permissions
      # policy rather than creating a second role.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

      - name: Build and push (Lambda-compatible manifest)
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -f Dockerfile.lambda -t ${{ secrets.ECR_REPOSITORY_URI }}:${{ github.sha }} \
            -t ${{ secrets.ECR_REPOSITORY_URI }}:latest --push .
          # --provenance=false --sbom=false is not optional: default buildx
          # behavior attaches attestations that produce a multi-manifest OCI
          # image index, and Lambda's CreateFunction/UpdateFunctionCode
          # rejects that with "image manifest ... media type is not
          # supported." (hit and fixed once already, on Project 1.)

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name churn-serving \
            --image-uri ${{ secrets.ECR_REPOSITORY_URI }}:${{ github.sha }}
