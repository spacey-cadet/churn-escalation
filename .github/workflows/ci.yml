name: CI

on:
  push:
    branches: [main, aws-serverless]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
        # No AWS credentials needed here -- tests/test_pipeline.py mocks
        # DynamoDB/S3 entirely via moto, so this job never touches real AWS
        # and costs nothing to run on every push.
